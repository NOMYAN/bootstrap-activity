<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>HTML + CSS</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
     
  <!-- Import custom stylesheet for the webpage-->
  <!-- after bootstrap cause read top-down -->
   <link rel="stylesheet" href="./styles/styles.css">

  </head>
  <body>

    <!-- Container for navbar and header -->
     <div class="container min-vh-75 pg-4">
      <!-- minview 75, padding, remove  bg-white . container is the one that scale the website accordingly-->

      <!-- Navigation Bar -->
      <!-- !https://getbootstrap.com/docs/5.3/components/navbar/#nav -->
      <nav class="navbar navbar-expand-md navbar-dark">
        <!-- change expand to see, set navbardark -->
        <!-- Remove bg-body-tertiary"> -->
        <div class="container-fluid">

          <a class="navbar-brand" href="#">
          <img src="./img/logo.png" alt="Company Logo" class="img-fluid">
          <!-- "img-fluid" is responsive img -->
        </a>


      <!-- Burger Menu that targets the navigation with the id sitMenu -->
       <!-- Still part of gbs.com navbar -->
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
              <!-- ms -clear everything from start so start from the right-->
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="#">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">About</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">Contact</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">Sign in/Login</a>
                <!-- change from disabled" aria-disabled="true">Disabled-->
              </li>
            </ul>
          </div>
        </div>
      </nav>
        

      <!-- Header -->
      <!-- Copy from https://getbootstrap.com/docs/5.3/examples/heroes/ -->
      <header class="homebanner rounded-4 text-center m1-4 pt-2 d-flex flex-column align-items-center justify-content-center">
        <!-- change the div to header - good for SEO as well. change to homebanner and adjust. display flex  -->
    
        <h1 class="display-1 text-white shadow-effects fw-lighter">Sole Runner</h1>
        <h4 class="display-6 text-white shadow-effects fw-lighter">Autumn Gear</h4>
        <!-- use display- to change the style, text to change colour, shadow effects alr declared in css, fontweight -->
           <button type="button" class="btn btn-primary">enter</button>
           <!-- button primary represent to all buttons -->
            <!-- .btn_site_overall -->
  
      </header>
      
    </div>
    
    <!-- End for Container navbar and header -->

    <!-- Newsletter -->

    <!-- Cards container -->
    
    
    <!-- Footer - Copyright -->
    

    <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"
    ></script>

  </body>
</html>
